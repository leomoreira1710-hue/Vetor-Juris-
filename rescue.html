<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar Vetor Juris</title><style>body{font-family:system-ui;background:#0d1b31;color:#eef4ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:620px;padding:28px;border:1px solid #38506f;border-radius:18px;background:#13243d}button{padding:12px 18px;border-radius:10px;border:0;background:#b6802e;color:white;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;color:#a9bdd4}</style></head><body><div class="card"><h1>Recuperar importador do Vetor Juris</h1><p>Esta página remove somente o HTML importado com defeito. Seus dados de estudo salvos no localStorage permanecem.</p><button id="go">Corrigir e voltar à plataforma</button><pre id="msg"></pre></div><script>document.getElementById('go').onclick=function(){var m=document.getElementById('msg');m.textContent='Removendo atualização local...';var req=indexedDB.deleteDatabase('VetorJurisLocalUpdater');req.onsuccess=function(){m.textContent='Correção concluída. Redirecionando...';setTimeout(function(){location.href='./';},700)};req.onerror=function(){m.textContent='Não foi possível remover automaticamente. Feche outras abas da plataforma e tente novamente.'};req.onblocked=function(){m.textContent='Feche todas as outras abas da plataforma e clique novamente.'};};</script></body></html>
